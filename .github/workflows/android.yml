name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [principal]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

           - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
        
      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q StardewCompanion_Android_Projeto_v3.zip -d projeto
          find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1 > projeto.txt

      - name: Compilar APK
        run: |
          DIR=$(dirname "$(cat projeto.txt)")
          gradle -p "$DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: StardewCompanion-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
